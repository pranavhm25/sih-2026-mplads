services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drishti-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8317}:8000"
    environment:
      - APP_ENV=development
      - DEMO_AUTOSEED=true
      - DATABASE_URL=sqlite:////app/data/drishti.db
      - REPORT_STORAGE_PATH=/app/reports
      - CORS_ORIGINS=http://localhost:5317,http://localhost:5199,http://127.0.0.1:5317,http://127.0.0.1:5199
    volumes:
      - drishti-data:/app/data
      - drishti-reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - drishti-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drishti-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5317}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - drishti-network

volumes:
  drishti-data:
  drishti-reports:

networks:
  drishti-network:
    driver: bridge
